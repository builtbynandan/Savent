services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savent}
      POSTGRES_USER: ${POSTGRES_USER:-savent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - savent_production_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-savent} -d $${POSTGRES_DB:-savent}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migration
    environment: &server-environment
      NODE_ENV: production
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL to the public HTTPS origin}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN}
      RELEASE_SHA: ${RELEASE_SHA:-local-production}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    depends_on:
      database:
        condition: service_healthy
    networks: [backend]
    restart: 'no'

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment: *server-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:80'
    networks: [backend]

networks:
  backend:

volumes:
  savent_production_data:
