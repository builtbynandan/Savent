name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://savent:savent@localhost:5432/savent?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: savent
          POSTGRES_USER: savent
          POSTGRES_PASSWORD: savent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U savent -d savent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Seed test database
        run: npm run db:seed

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f compose.production.yml config --quiet

      - name: Build production client image
        run: docker build -f apps/client/Dockerfile -t savent-client:ci .

      - name: Build production server image
        run: docker build -f apps/server/Dockerfile -t savent-server:ci .
